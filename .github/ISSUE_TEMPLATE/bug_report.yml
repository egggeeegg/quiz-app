name: Bug report
description: Something behaves differently from what the README describes
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste real question-bank content, credentials or database files.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Actual behaviour, including the exact error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npm run seed
        2. npm run dev
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v1.0.0 or commit hash
  - type: dropdown
    id: deploy
    attributes:
      label: Deployment
      options:
        - Docker Compose
        - Local (npm run dev)
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
